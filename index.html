<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>送给驶妈妈们的礼物</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            user-select: none;
            overflow: hidden;

            /* ===== 背景图设置 ===== */
            background-image: linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.35)), url('ald1.jpg');
            background-size: cover;
            background-position: center 30%;
            background-repeat: no-repeat;
        }

        /* 闪闪发光动态标题 */
        h1 {
            font-size: 40px;
            font-weight: 900;
            margin-top: 40px;    
            margin-bottom: 5px;  
            
            /* 流光金色渐变 */
            background: linear-gradient(
                90deg, 
                #bf953f 0%, 
                #fcf6ba 25%, 
                #ffffff 50%, 
                #fcf6ba 75%, 
                #bf953f 100%
            );
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            
            /* 组合动画：流光扫过 + 金光呼吸发光 */
            animation: shine 2.5s linear infinite, goldGlow 1.5s ease-in-out infinite alternate;
        }

        /* 文字扫光动画 */
        @keyframes shine {
            to {
                background-position: 200% center;
            }
        }

        /* 金黄光芒呼吸发光效果 */
        @keyframes goldGlow {
            0% {
                filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.6)) 
                        drop-shadow(0px 0px 10px rgba(255, 215, 0, 0.8));
            }
            100% {
                filter: drop-shadow(0px 2px 6px rgba(0,0,0,0.8)) 
                        drop-shadow(0px 0px 25px rgba(255, 223, 0, 1)) 
                        drop-shadow(0px 0px 40px rgba(255, 180, 0, 0.9));
            }
        }

        /* 计数器容器 */
        .counter {
            font-size: 22px;
            color: #ffffff;
            font-weight: bold;
            margin-bottom: 0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8), 0 0 10px rgba(255, 64, 129, 0.8);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* 🚽 冲厕所清零按钮样式 */
        .reset-btn {
            font-size: 14px;
            font-weight: bold;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 4px 12px;
            border-radius: 20px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
            outline: none;
        }

        .reset-btn:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: scale(1.05);
        }

        .reset-btn:active {
            transform: scale(0.92);
            background: rgba(0, 180, 255, 0.5);
        }

        /* 主角色容器 */
        .pig-container {
            position: relative;
            cursor: pointer;
            margin-top: 90px;
            transition: transform 0.1s ease;
        }

        /* 点击时缩放按压效果 */
        .pig-container:active {
            transform: scale(1.1, 0.9) translateY(5px);
        }

        /* 主角色原图样式 */
        .character-img {
            max-width: 260px;
            max-height: 260px;
            height: auto;
            display: block;
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.4));
            transition: all 0.3s ease;
        }

        /* 🌟 金色大爆炸角色震撼缩放特效 */
        .gold-explode {
            animation: characterExplode 0.85s ease-out forwards;
        }

        @keyframes characterExplode {
            0% {
                transform: scale(1) rotate(0deg);
                filter: drop-shadow(0 0 0px rgba(255, 215, 0, 0)) brightness(1);
            }
            25% {
                transform: scale(1.25) rotate(-5deg);
                filter: drop-shadow(0 0 50px rgba(255, 215, 0, 1)) brightness(1.6);
            }
            60% {
                transform: scale(0.9) rotate(3deg);
                filter: drop-shadow(0 0 60px rgba(255, 245, 180, 1)) brightness(1.8);
            }
            100% {
                transform: scale(1) rotate(0deg);
                filter: drop-shadow(0 8px 16px rgba(0,0,0,0.4));
            }
        }

        /* 🌀 金色旋转漩涡激光 */
        .vortex-laser {
            position: absolute;
            top: 50%;
            left: 50%;
            height: 6px;
            background: linear-gradient(90deg, transparent 0%, #ffffff 15%, #fff176 35%, #ffd700 70%, transparent 100%);
            border-radius: 6px;
            transform-origin: left center;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.9), 0 0 25px rgba(255, 255, 255, 0.8);
            pointer-events: none;
            z-index: 5;
            animation: vortexShoot 0.8s cubic-bezier(0.1, 0.8, 0.25, 1) forwards;
        }

        @keyframes vortexShoot {
            0% {
                width: 0px;
                opacity: 0;
                transform: translate(0, -50%) rotate(var(--base-angle)) scaleX(0);
            }
            20% {
                opacity: 1;
                width: 300px;
            }
            100% {
                width: 1200px;
                opacity: 0;
                transform: translate(0, -50%) rotate(calc(var(--base-angle) + 200deg)) scaleX(1.4);
            }
        }

        /* 💥 金色冲击波光环 */
        .gold-shockwave {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            border: 4px solid rgba(255, 240, 150, 0.9);
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.8), inset 0 0 20px rgba(255, 215, 0, 0.8);
            pointer-events: none;
            z-index: 4;
            animation: shockwaveExpand 0.75s ease-out forwards;
        }

        @keyframes shockwaveExpand {
            0% {
                transform: translate(-50%, -50%) scale(0.2) rotate(0deg);
                opacity: 1;
            }
            50% {
                opacity: 0.8;
            }
            100% {
                transform: translate(-50%, -50%) scale(25) rotate(90deg);
                opacity: 0;
                border-width: 1px;
            }
        }

        /* 便便基础样式 */
        .poop {
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }

        /* 💩 居中排版 */
        .poop-content {
            position: relative;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            font-size: 110px;
            line-height: 1;
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.4));
        }

        /* 🏷️ 名字标签 */
        .poop-name {
            position: absolute;
            bottom: 100%;
            margin-bottom: -10px;
            left: 50%;
            font-size: 22px;
            font-weight: 900;
            color: #ffffff;
            background-color: rgba(50, 20, 5, 0.95);
            padding: 5px 14px;
            border-radius: 10px;
            white-space: nowrap;
            letter-spacing: 1px;
            text-shadow: 1px 2px 4px rgba(0, 0, 0, 0.9);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.5);
            pointer-events: none;
            z-index: 11;
        }
    </style>
</head>
<body>

    <!-- 闪闪发光动态标题 -->
    <h1>送给驶妈妈们的礼物</h1>
    
    <!-- 拉驶记录 + 冲厕所按钮 -->
    <div class="counter">
        <span>拉驶记录：<span id="count">0</span> 坨 💩</span>
        <button class="reset-btn" id="resetBtn">🚽 冲厕所</button>
    </div>

    <!-- 主角色图片容器 -->
    <div class="pig-container" id="pig">
        <img id="characterImg" class="character-img" src="拉驶中.png" alt="角色图片">
    </div>

    <script>
        const pig = document.getElementById('pig');
        const characterImg = document.getElementById('characterImg');
        const countDisplay = document.getElementById('count');
        const resetBtn = document.getElementById('resetBtn');

        let count = 0;

        // 7位成员名字
        const names = [
            "李相沅", 
            "李理悟", 
            "周安信", 
            "张家豪", 
            "郑相炫", 
            "金俊抒", 
            "贺鑫隆"
        ];

        // ===== 🎵 成员音量配置 =====
        const volumeMap = {
            "李相沅": 0.85,
            "李理悟": 0.85,
            "周安信": 0.85,
            "张家豪": 1.0,
            "郑相炫": 0.85,
            "金俊抒": 0.6,
            "贺鑫隆": 0.85,
            "ald1": 0.85
        };

        // 播放音频通用函数
        function playAudioFile(keyName, filename) {
            const audio = new Audio(filename);
            
            if (volumeMap[keyName] !== undefined) {
                audio.volume = volumeMap[keyName];
            } else {
                audio.volume = 1.0;
            }

            audio.currentTime = 0;
            audio.play().catch(err => {
                console.log(`播放 ${filename} 失败，请确认文件路径及文件名是否正确:`, err);
            });
        }

        // 1. 点击图像发💩
        pig.addEventListener('click', () => {
            characterImg.src = '拉驶中.png';

            count++;
            countDisplay.innerText = count;

            const randomIndex = Math.floor(Math.random() * names.length);
            const chosenName = names[randomIndex];

            playAudioFile(chosenName, `${chosenName}.mp3`);

            const poop = document.createElement('div');
            poop.className = 'poop';
            poop.style.left = '50%';
            poop.style.top = '50%';
            poop.style.transform = 'translate(-50%, -50%)';

            const nameId = `name_${Date.now()}_${Math.floor(Math.random()*1000)}`;

            poop.innerHTML = `
                <div class="poop-content">
                    <span class="poop-name" id="${nameId}">${chosenName}</span>
                    💩
                </div>
            `;

            const angle = Math.random() * Math.PI * 2;
            const distance = 220 + Math.random() * 260;
            const targetX = Math.cos(angle) * distance;
            const targetY = Math.sin(angle) * distance;
            const rotateDeg = (Math.random() - 0.5) * 720;

            const animName = `burst_${Date.now()}_${Math.floor(Math.random()*1000)}`;
            // 关键调整：动画前半段急速弹出，后半段长时间缓缓悬停，最后快速隐去
            const keyframes = `
                @keyframes ${animName} {
                    0% {
                        opacity: 1;
                        transform: translate(-50%, -50%) scale(0.2) rotate(0deg);
                    }
                    30% {
                        opacity: 1;
                        transform: translate(calc(-50% + ${targetX * 0.85}px), calc(-50% + ${targetY * 0.85}px)) scale(1.1) rotate(${rotateDeg * 0.75}deg);
                    }
                    85% {
                        opacity: 1;
                        transform: translate(calc(-50% + ${targetX}px), calc(-50% + ${targetY}px)) scale(1) rotate(${rotateDeg}deg);
                    }
                    100% {
                        opacity: 0;
                        transform: translate(calc(-50% + ${targetX * 1.05}px), calc(-50% + ${targetY * 1.05}px)) scale(0.8) rotate(${rotateDeg * 1.05}deg);
                    }
                }

                @keyframes ${animName}_fixText {
                    0% {
                        transform: translate(-50%, 0) rotate(0deg);
                    }
                    30% {
                        transform: translate(-50%, 0) rotate(${-rotateDeg * 0.75}deg);
                    }
                    85% {
                        transform: translate(-50%, 0) rotate(${-rotateDeg}deg);
                    }
                    100% {
                        transform: translate(-50%, 0) rotate(${-rotateDeg * 1.05}deg);
                    }
                }
            `;

            const styleSheet = document.createElement('style');
            styleSheet.innerHTML = keyframes;
            document.head.appendChild(styleSheet);

            // 停留时间提升至 1.6 秒（1600ms）
            const duration = '1.6s';
            poop.style.animation = `${animName} ${duration} cubic-bezier(0.1, 0.85, 0.25, 1) forwards`;

            pig.appendChild(poop);

            const nameEl = document.getElementById(nameId);
            if(nameEl) {
                nameEl.style.animation = `${animName}_fixText ${duration} cubic-bezier(0.1, 0.85, 0.25, 1) forwards`;
            }

            setTimeout(() => {
                poop.remove();
                styleSheet.remove();
            }, 1600); // 同步 1.6 秒后清理 DOM
        });

        // 2. 点击“冲厕所”
        resetBtn.addEventListener('click', () => {
            count = 0;
            countDisplay.innerText = count;
            characterImg.src = '最爱小狗驶.png';
            
            characterImg.classList.remove('gold-explode');
            void characterImg.offsetWidth;
            characterImg.classList.add('gold-explode');

            const wave = document.createElement('div');
            wave.className = 'gold-shockwave';
            pig.appendChild(wave);
            setTimeout(() => wave.remove(), 750);

            const laserCount = 16;
            for (let i = 0; i < laserCount; i++) {
                const laser = document.createElement('div');
                laser.className = 'vortex-laser';
                
                const baseAngle = i * (360 / laserCount);
                laser.style.setProperty('--base-angle', `${baseAngle}deg`);
                
                pig.appendChild(laser);
                
                setTimeout(() => {
                    laser.remove();
                }, 800);
            }

            playAudioFile('ald1', 'ald1.mp3');
        });
    </script>
</body>
</html>
